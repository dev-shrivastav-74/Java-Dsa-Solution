name: Java DSA CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:

  compile:
    name: Compile Java
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile Java solutions
        run: mvn -B -DskipTests compile


  lint:
    name: Java Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Java Lint
        shell: bash
        run: |
          set -e

          mkdir -p build

          files=$(find src -name "*.java" \
            -not -path "*/target/*")

          if [ -z "$files" ]; then
            echo "❌ No Java solution files found."
            exit 1
          fi

          for file in $files
          do
            echo "Linting: $file"
            javac -Xlint:all -Werror -d build "$file"
            echo "✅ Lint passed: $file"
          done


  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run JUnit tests
        run: mvn -B test


  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests with JaCoCo
        run: |
          mvn -B clean test jacoco:report

      - name: Generate coverage table
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import os

          report = "target/site/jacoco/jacoco.xml"

          if not os.path.exists(report):
              print("❌ JaCoCo report not found.")
              exit(1)

          root = ET.parse(report).getroot()

          rows = []
          total_missed = 0
          total_covered = 0

          for package in root.findall("package"):
              package_name = package.attrib.get("name", "")

              for cls in package.findall("class"):
                  class_name = cls.attrib.get("name", "")
                  file_name = class_name.split("/")[-1] + ".java"

                  line_counter = None

                  for counter in cls.findall("counter"):
                      if counter.attrib["type"] == "LINE":
                          line_counter = counter
                          break

                  if line_counter is None:
                      continue

                  missed = int(line_counter.attrib["missed"])
                  covered = int(line_counter.attrib["covered"])
                  total = missed + covered

                  coverage = (covered / total * 100) if total else 0

                  total_missed += missed
                  total_covered += covered

                  rows.append(
                      f"| `{file_name}` | {covered} | {total} | {coverage:.2f}% |"
                  )

          total_lines = total_missed + total_covered
          total_coverage = (
              total_covered / total_lines * 100
              if total_lines
              else 0
          )

          print("")
          print("## Test Coverage")
          print("")
          print("| File | Lines Covered | Total Lines | Coverage |")
          print("|---|---:|---:|---:|")

          for row in rows:
              print(row)

          print(
              f"| **Total** | **{total_covered}** | "
              f"**{total_lines}** | **{total_coverage:.2f}%** |"
          )

          # GitHub Actions Summary
          summary = os.environ["GITHUB_STEP_SUMMARY"]

          with open(summary, "a", encoding="utf-8") as f:
              f.write("## 📊 Test Coverage\n\n")
              f.write("| File | Lines Covered | Total Lines | Coverage |\n")
              f.write("|---|---:|---:|---:|\n")

              for row in rows:
                  f.write(row + "\n")

              f.write(
                  f"| **Total** | **{total_covered}** | "
                  f"**{total_lines}** | **{total_coverage:.2f}%** |\n"
              )

              f.write("\n")

              if total_coverage >= 70:
                  f.write("✅ **Coverage requirement passed — minimum 70%.**\n")
              else:
                  f.write("❌ **Coverage requirement failed — minimum 70%.**\n")
                  exit(1)
          PY


  format:
    name: Java Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download Google Java Format
        run: |
          curl -L \
            -o google-java-format.jar \
            https://github.com/google/google-java-format/releases/download/v1.36.1/google-java-format-1.36.1-all-deps.jar

      - name: Check formatting
        shell: bash
        run: |
          set -e

          files=$(find src test -name "*.java" \
            -not -path "*/target/*")

          for file in $files
          do
            echo "Formatting: $file"

            java -jar google-java-format.jar \
              --dry-run \
              --set-exit-if-changed \
              "$file"

            echo "✅ Format passed: $file"
          done